name: pos_core
description: Thème, i18n, routing, utilitaires et widgets partagés du module POS
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.6.0
  provider: ^6.1.2
  intl: 0.20.2
  logger: ^2.4.0
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
