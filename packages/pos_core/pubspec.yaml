name: pos_core
description: Thème, i18n, routing, utilitaires et widgets partagés du module POS
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^17.3.0
  provider: ^6.1.5+1
  intl: 0.20.2
  logger: ^2.7.0
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  mobile_scanner: ^7.4.0
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
