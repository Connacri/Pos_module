name: pos_module
description: Workspace monorepo du module POS - Flutter, ObjectBox, Supabase
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

workspace:
  - app
  - packages/pos_core
  - packages/pos_domain
  - packages/pos_data
  - packages/pos_pos
  - packages/pos_inventory
  - packages/pos_billing
  - packages/freebox_sync

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  app:
    path: app
  pos_core:
    path: packages/pos_core
  pos_domain:
    path: packages/pos_domain
  pos_data:
    path: packages/pos_data
  pos_pos:
    path: packages/pos_pos
  pos_inventory:
    path: packages/pos_inventory
  pos_billing:
    path: packages/pos_billing
  freebox_sync:
    path: packages/freebox_sync
  go_router: ^17.3.0
  package_info_plus: ^8.3.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  fl_chart: ^1.1.1
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

