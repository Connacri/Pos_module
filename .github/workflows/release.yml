name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: 1.2.3). Laisser vide pour incrémenter automatiquement la dernière version.'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Créer la release (APK + Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Déterminer la prochaine version
        id: version
        shell: pwsh
        run: |
          $version = $null
          if ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)$') {
            $version = $matches[1]
          } elseif ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION
          } else {
            $versions = @()
            foreach ($t in (git ls-remote --tags origin 2>$null)) {
              if ($t -match 'refs/tags/v(\d+\.\d+\.\d+)$') {
                $versions += [version]$matches[1]
              }
            }
            $latest = $versions | Sort-Object | Select-Object -Last 1
            if (-not $latest) { $latest = [version]'0.0.0' }
            $version = "$($latest.Major).$($latest.Minor).$($latest.Build + 1)"
          }
          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          echo "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - name: Créer le tag (automatique sur master ou manuel)
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          if (git rev-parse $tag > $null 2>&1) {
            Write-Host "Le tag $tag existe déjà, skip."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag $tag
            git push origin $tag
            Write-Host "Tag $tag créé et poussé."
          }

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Résolution du workspace
        run: flutter pub get

      - name: Génération ObjectBox
        working-directory: packages/pos_data
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Mettre à jour la version selon le tag
        shell: pwsh
        run: |
          $buildNumber = 1
          $tags = git tag --list 'v*' 2>$null
          if ($tags) { $buildNumber = $tags.Count }
          $versionLine = "version: $env:VERSION+$buildNumber"
          foreach ($f in @('pubspec.yaml', 'app/pubspec.yaml')) {
            $content = Get-Content $f -Raw
            $content = [regex]::Replace($content, '(?m)^version: .*$', $versionLine)
            Set-Content -Path $f -Value $content -NoNewline
            Write-Host "$f -> $versionLine"
          }
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Restaurer le keystore et la config de signature
        shell: pwsh
        run: |
          if ($env:KEYSTORE_B64) {
            [IO.File]::WriteAllBytes(
              'app/android/app/upload-keystore.jks',
              [Convert]::FromBase64String($env:KEYSTORE_B64))
            $props = "storePassword=$env:KEYSTORE_PASSWORD`n" +
                     "keyPassword=$env:KEY_PASSWORD`n" +
                     "keyAlias=$env:KEY_ALIAS`n" +
                     "storeFile=upload-keystore.jks"
            Set-Content -Path 'app/android/key.properties' -Value $props -NoNewline
          } else {
            Write-Host 'Aucun keystore fourni, build avec la signature debug.'
          }
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Build APK signé
        working-directory: app
        run: flutter build apk --release

      - name: Build Windows
        working-directory: app
        run: flutter build windows --release

      - name: Installer Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Mettre à jour la version dans le script Inno
        shell: pwsh
        run: |
          $iss = Get-Content 'app\windows\installer\pos_module.iss' -Raw
          $iss = $iss -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$env:VERSION`""
          Set-Content 'app\windows\installer\pos_module.iss' $iss -NoNewline
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Compiler l'installeur
        run: ISCC.exe "app\windows\installer\pos_module.iss"

      - name: Signer l'installeur Windows (Authenticode)
        if: env.WIN_CERT_B64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes(
            'app\windows\installer\cert.pfx',
            [Convert]::FromBase64String($env:WIN_CERT_B64))
          $signtool = Get-ChildItem "$env:ProgramFiles (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe introuvable" }
          $exe = Get-ChildItem 'app\build\installer\POSModule-Setup-*.exe' | Select-Object -First 1
          & $signtool.FullName sign /f app\windows\installer\cert.pfx /p $env:WIN_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 $exe.FullName
        env:
          WIN_CERT_B64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          body: >
            Builds générés automatiquement par le workflow Release :
            APK Android et installeur Windows (Inno Setup).
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/installer/POSModule-Setup-*.exe
