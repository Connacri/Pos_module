name: Release

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (ex: 1.0.1). Laisser vide pour incrémenter automatiquement.'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Créer la release Web / PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification des types
        run: npm run lint

      - name: Build de production
        run: npm run build

      - name: Déterminer la version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            PKG_VER=$(node -p "require('./package.json').version || '1.0.0'")
            COMMITS_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo "1")
            VERSION="${PKG_VER}.${COMMITS_COUNT}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Créer l'archive zip pour déploiement
        shell: bash
        run: |
          cd dist && zip -r ../pos-module-web-${{ steps.version.outputs.version }}.zip . && cd ..

      - name: Créer le tag et la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## POS Module Pro - Release ${{ steps.version.outputs.version }}
            - Application Point de Vente Web & PWA
            - Build de production optimisé prêt à déployer
          files: |
            pos-module-web-${{ steps.version.outputs.version }}.zip
