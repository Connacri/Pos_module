name: Release

# Publie une release versionnée à chaque push sur master/main :
#   - APK Android signé (release, pas debug)
#   - AAB signé (Google Play)
#   - Archive Web/PWA
#   - Sommes de contrôle SHA-256
# Le tag (vX.Y.Z) n'est créé qu'après un build réussi : aucun tag orphelin.

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version semver (ex: 1.2.3). Vide = incrément automatique du patch.'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build signé + Release GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configuration de Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configuration du SDK Android
        uses: android-actions/setup-android@v3

      - name: Installation du SDK Android requis
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 \
            || yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" >/dev/null

      - name: Installation des dépendances
        run: npm ci --no-audit --no-fund

      - name: Vérification des types
        run: npm run lint

      - name: Build de production Web
        run: npm run build

      - name: Déterminer la version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.version }}"

          if [ -n "${INPUT:-}" ]; then
            VERSION="$INPUT"
          elif EXISTING="$(git tag --points-at HEAD --list 'v*' | sort -V | tail -n1)" && [ -n "$EXISTING" ]; then
            # Re-run sur un commit déjà releasé : on réutilise la même version.
            VERSION="${EXISTING#v}"
          else
            LATEST="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
            if [ -z "$LATEST" ]; then
              VERSION="1.0.0"
            else
              IFS=. read -r MA MI PA <<< "${LATEST#v}"
              VERSION="$MA.$MI.$((PA + 1))"
            fi
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide '$VERSION' (format attendu MAJOR.MINOR.PATCH)"
            exit 1
          fi

          IFS=. read -r MA MI PA <<< "$VERSION"
          CODE=$(( MA * 10000 + MI * 100 + PA ))

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (versionCode $CODE)"

      - name: Synchroniser les assets Web avec Capacitor
        run: npx cap sync android

      - name: Restaurer le keystore de production
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant — la release exige un APK signé pour la production."
            echo "::error::Configurez ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS et ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          {
            echo "storeFile=app/release.keystore"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/key.properties
          chmod 600 android/key.properties android/app/release.keystore

      - name: Build APK + AAB signés
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Vérifier la signature de l'APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose --print-certs \
            "android/app/build/outputs/apk/release/app-release.apk" | tee apksigner-report.txt
          if grep -q "CN=Android Debug" apksigner-report.txt; then
            echo "::error::L'APK est signé avec la clé debug — publication refusée."
            exit 1
          fi
          if ! grep -q "CN=Android Debug\|Signer #1 certificate DN" apksigner-report.txt; then
            echo "::error::Aucun certificat de signature détecté dans l'APK."
            exit 1
          fi

      - name: Préparer les livrables
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk \
             "release-artifacts/pos-module-pro-${VERSION}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "release-artifacts/pos-module-pro-${VERSION}.aab"
          (cd dist && zip -qr "../release-artifacts/pos-module-web-${VERSION}.zip" .)
          (cd release-artifacts && sha256sum ./* > SHA256SUMS.txt)
          ls -lh release-artifacts/

      - name: Rédiger les notes de release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE="HEAD"; fi
          git log "$RANGE" --no-merges --pretty=format:'- %s (`%h`)' | head -40 > changelog.md || true

          {
            echo "## 🍃 POS Module Pro v${VERSION}"
            echo
            echo "### 📱 Android"
            echo "- **pos-module-pro-${VERSION}.apk** — APK signé, installable directement (Android 7.0+)"
            echo "- **pos-module-pro-${VERSION}.aab** — App Bundle signé pour Google Play"
            echo
            echo "### 🌐 Web / PWA"
            echo "- **pos-module-web-${VERSION}.zip** — build statique prêt à héberger"
            echo
            echo "### 🆕 Nouveautés"
            cat changelog.md
            echo
            echo "### 🔐 Intégrité"
            echo '```'
            cat release-artifacts/SHA256SUMS.txt
            echo '```'
          } > release-notes.md

      - name: Publier la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: POS Module Pro v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: release-artifacts/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archiver les livrables dans le run
        uses: actions/upload-artifact@v4
        with:
          name: pos-module-pro-${{ steps.version.outputs.version }}
          path: release-artifacts/
          retention-days: 30

      - name: Nettoyer les secrets temporaires
        if: always()
        run: |
          rm -f android/key.properties android/app/release.keystore apksigner-report.txt
