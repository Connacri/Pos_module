name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version de la release (ex: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Créer la release (APK + Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraire la version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME.Substring(1) } else { $env:INPUT_VERSION }
          echo "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - name: Créer le tag si déclenché manuellement
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$env:VERSION"
          git push origin "v$env:VERSION"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Résolution du workspace
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Build Windows
        working-directory: app
        run: flutter build windows --release

      - name: Installer Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Mettre à jour la version dans le script Inno
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME.Substring(1) } else { $env:INPUT_VERSION }
          $iss = Get-Content 'app\windows\installer\pos_module.iss' -Raw
          $iss = $iss -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`""
          Set-Content 'app\windows\installer\pos_module.iss' $iss -NoNewline
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}

      - name: Compiler l'installeur
        run: ISCC.exe "app\windows\installer\pos_module.iss"

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: Release ${{ steps.version.outputs.version }}
          body: >
            Builds générés automatiquement par le workflow Release :
            APK Android et installeur Windows (Inno Setup).
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/installer/POSModule-Setup-*.exe
