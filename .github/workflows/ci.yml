name: CI

on:
  push:
    branches: [master, develop, main]
  pull_request:
    branches: [master, develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Vérification TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci --no-audit --no-fund

      - name: Contrôle de syntaxe & types (TypeScript)
        run: npm run lint

  build:
    name: Compilation & Build Web
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installation des dépendances
        run: npm ci --no-audit --no-fund

      - name: Compilation de production Vite
        run: npm run build

      - name: Uploader l'artefact de production (dist)
        uses: actions/upload-artifact@v4
        with:
          name: pos-web-dist
          path: dist/
          retention-days: 14

  # Validation du projet Android sur les pull requests uniquement :
  # la release signée est produite par release.yml, pas ici.
  android:
    name: Validation build Android (debug)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Configuration de Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Configuration du SDK Android
        uses: android-actions/setup-android@v3

      - name: Installation du SDK Android requis
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 \
            || yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" >/dev/null

      - name: Installation des dépendances
        run: npm ci --no-audit --no-fund

      - name: Build Web + synchronisation Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Build APK debug (validation)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Uploader l'APK de validation
        uses: actions/upload-artifact@v4
        with:
          name: pos-module-pro-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
