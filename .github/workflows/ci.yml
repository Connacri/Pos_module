name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Résolution du workspace
        run: flutter pub get

      - name: Génération ObjectBox
        working-directory: packages/pos_data
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyse
        run: flutter analyze

      - name: Analyse pos_domain
        working-directory: packages/pos_domain
        run: dart analyze

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Résolution du workspace
        run: flutter pub get

      - name: Génération ObjectBox
        working-directory: packages/pos_data
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Tests domain
        working-directory: packages/pos_domain
        run: dart test

      - name: Tests app
        working-directory: app
        run: flutter test

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Résolution du workspace
        run: flutter pub get

      - name: Génération ObjectBox
        working-directory: packages/pos_data
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        working-directory: app
        run: flutter build apk --release
