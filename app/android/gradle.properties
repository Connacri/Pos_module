# Limites de mémoire compatibles avec les runners GitHub Actions Windows (7 Go de RAM).
# -Xmx8G y empêche le démarrage du daemon Gradle (assembleRelease reste bloqué puis annulé).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Évite qu'un daemon Gradle résident épuise la mémoire du runner CI.
org.gradle.daemon=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Évite l'erreur "this and base files have different roots" (sources Pub Cache sur un lecteur différent)
kotlin.incremental=false
